<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일기 (Journal)</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#fff; color:#222; zoom:0.85;
         font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:15px; }
  #top { width:1240px; max-width:100%; height:96px; border-bottom:2px solid #ddd; box-sizing:border-box; margin:0 auto; }
  #top h1 { margin:0; padding:6px 20px; font-family:"Nanum Pen Script",cursive; font-size:48px;
            font-weight:normal; color:#5a4630; line-height:1.2; }
  #main { display:flex; width:1240px; max-width:100%; margin:0 auto; }
  #left { flex:0 0 850px; max-width:65%; box-sizing:border-box; padding:0 0 0 18px; borFder-right:2px solid #ddd; }
  #date { font-weight:bold; font-size:17px; margin:75px 0 28px; }
  #text { height:720px; overflow-y:auto; white-space:pre-wrap; line-height:2.1; letter-spacing:1px;
          padding-right:20px; word-spacing:3px; }
  #text::-webkit-scrollbar { width:17px; }
  #text::-webkit-scrollbar-thumb { background:#8a8a8a; border-radius:9px; border:3px solid #fff; }
  #text::-webkit-scrollbar-track { background:#fafafa; }
  #editor { display:none; }
  #editor textarea { width:96%; height:640px; box-sizing:border-box; font:inherit; line-height:1.9;
                     border:1px solid #ccc; padding:10px; resize:none; }
  .btn { background:none; border:1px solid #aaa; padding:4px 14px; margin:8px 6px 0 0; cursor:pointer;
         font:inherit; font-size:13px; color:#444; }
  .btn:hover { background:#f2f2f2; }
  #right { flex:1; text-align:center; padding-top:75px; min-width:260px; }
  #ym { font-size:17px; margin-bottom:44px; letter-spacing:1px; }
  table { margin:0 auto; border-collapse:collapse; }
  th { font-weight:normal; padding:6px 7px; font-size:16px; }
  th.sun { color:#d682d6; } th.sat { color:#5bb5b5; }
  td { padding:11px 8px; text-align:center; font-size:16px; letter-spacing:1px; min-width:24px; }
  td a { color:#333; cursor:pointer; text-decoration:none; }
  td a.has { font-weight:bold; border-bottom:2px solid #5a4630; }
  td a.sel { background:#5a4630; color:#fff; padding:3px 6px; border-radius:3px; border-bottom:0; }
  #pn { margin:26px 0 22px; color:#999; font-size:16px; letter-spacing:1px; }
  #pn a { cursor:pointer; color:#999; margin:0 18px; }
  #pn a:hover { color:#333; }
  select { font:inherit; font-size:15px; margin:0 14px; padding:1px 4px; }
  #tools { margin-top:34px; }
  #top h1 .sub { font-family:"Nanum Pen Script",cursive; font-size:26px; color:#9a8870; margin-left:8px; letter-spacing:1px; }
  #gate { position:fixed; inset:0; background:#fff; z-index:99; display:flex; align-items:center; justify-content:center; }
  #gate .box { text-align:center; }
  #gate .gt { font-family:"Nanum Pen Script",cursive; font-size:56px; color:#5a4630; margin-bottom:20px; }
  #gate input { font:inherit; padding:8px 12px; border:1px solid #bbb; width:200px; text-align:center; letter-spacing:3px; }
  #gmsg { color:#c55; margin-top:12px; min-height:20px; font-size:14px; }
</style>
</head>
<body>
  <div id="gate">
  <div class="box">
    <div class="gt">일기</div>
    <div style="margin-bottom:10px;color:#777;font-size:14px;">생일을 입력하세요 (mmdd)</div>
    <input id="gpw" type="password" inputmode="numeric" maxlength="4" placeholder="생일 (mmdd)" onkeydown="if(event.key==='Enter')unlock()">
    <button class="btn" onclick="unlock()">입장</button>
    <div id="gmsg"></div>
  </div>
</div>
<div id="top"><h1>일기 <span class="sub">journaling</span></h1></div>
<div id="main">
  <div id="left">
    <div id="date"></div>
    <div id="text"></div>
    <div id="editor">
      <textarea id="ta" placeholder="내용을 입력하세요"></textarea>
      <button class="btn" onclick="save()">저장</button>
      <button class="btn" onclick="cancelEdit()">취소</button>
    </div>
  </div>
  <div id="right">
    <div id="ym"></div>
    <table id="cal"></table>
    <div id="pn"><a onclick="moveMonth(-1)">이전달 &lt;&lt;</a><a onclick="moveMonth(1)">&gt;&gt; 다음달</a></div>
    <select id="selY" onchange="jump()"></select>
    <select id="selM" onchange="jump()"></select>
    <div id="tools">
      <button class="btn" onclick="startEdit()">글쓰기 / 수정</button>
      <button class="btn" onclick="del()">삭제</button>
    </div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxvhg42m_Etoh92vhrBlIAE-aJNeXFPY3HGmKJ7rJuQbzCGPDvJz_ibPNdWqNddwY8e/exec";

const pad = n => String(n).padStart(2, "0");
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let data = {}, sel, cy, cm;

function initSelects() {
  const y = document.getElementById("selY"), m = document.getElementById("selM");
  for (let i = 2000; i <= 2040; i++) y.innerHTML += `<option value="${i}">${i}년</option>`;
  for (let i = 1; i <= 12; i++) m.innerHTML += `<option value="${i}">${i}월</option>`;
}

function render() {
  const [y, m, d] = sel.split("-").map(Number);
  document.getElementById("date").textContent = `${y}년 ${m}월 ${d}일`;
  document.getElementById("text").innerHTML =
    data[sel] ? esc(data[sel]) : '<span style="color:#aaa">이 날의 글이 없습니다.</span>';
  document.getElementById("text").scrollTop = 0;

  document.getElementById("ym").textContent = `${cy}년 \u00A0 ${cm}월`;
  document.getElementById("selY").value = cy;
  document.getElementById("selM").value = cm;

  const first = new Date(cy, cm - 1, 1).getDay();
  const last = new Date(cy, cm, 0).getDate();
  let h = '<tr><th class="sun">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th class="sat">土</th></tr><tr>';
  for (let i = 0; i < first; i++) h += "<td></td>";
  for (let day = 1; day <= last; day++) {
    const key = `${cy}-${pad(cm)}-${pad(day)}`;
    const cls = (data[key] ? "has " : "") + (key === sel ? "sel" : "");
    h += `<td><a class="${cls}" onclick="pick('${key}')">${day}</a></td>`;
    if ((first + day) % 7 === 0 && day < last) h += "</tr><tr>";
  }
  document.getElementById("cal").innerHTML = h + "</tr>";
}

function pick(k) { cancelEdit(); sel = k; render(); }
function moveMonth(n) {
  cm += n;
  if (cm < 1) { cm = 12; cy--; } else if (cm > 12) { cm = 1; cy++; }
  render();
}
function jump() {
  cy = +document.getElementById("selY").value;
  cm = +document.getElementById("selM").value;
  render();
}

function getPw() { return sessionStorage.getItem("pw");
}
  
async function startEdit() {
  const pw = getPw();
  if (!pw) return;
  try {
    if (!(await send({ action: "check", pw }))) return;
  } catch (err) { return alert("서버에 연결하지 못했습니다."); }
  document.getElementById("text").style.display = "none";
  document.getElementById("editor").style.display = "block";
  document.getElementById("ta").value = data[sel] || "";
  document.getElementById("ta").focus();
}
function cancelEdit() {
  document.getElementById("editor").style.display = "none";
  document.getElementById("text").style.display = "block";
}
async function send(payload) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  const r = await res.text();
  if (r === "pw") { sessionStorage.removeItem("pw"); alert("비밀번호가 틀렸습니다."); return false; }
  return true;
}
async function save() {
  const text = document.getElementById("ta").value;
  if (!text.trim()) return alert("내용을 입력해주세요.");
  try {
    if (await send({ action: "save", pw: getPw(), date: sel, text })) {
      data[sel] = text; cancelEdit(); render();
    }
  } catch (err) { alert("저장에 실패했습니다."); }
}
async function del() {
  if (!data[sel] || !getPw() || !confirm("이 날의 글을 삭제할까요?")) return;
  try {
    if (await send({ action: "delete", pw: getPw(), date: sel })) { delete data[sel]; render(); }
  } catch (err) { alert("삭제에 실패했습니다."); }
}

async function unlock() {
  const pw = document.getElementById("gpw").value.trim();
  const msg = document.getElementById("gmsg");
  if (!pw) return;
  msg.textContent = "확인 중...";
  try {
    const t = await (await fetch(API + "?pw=" + encodeURIComponent(pw))).text();
    if (t === "pw") { sessionStorage.removeItem("pw"); msg.textContent = "틀렸습니다."; return; }
    sessionStorage.setItem("pw", pw);
    JSON.parse(t).forEach(e => data[e.date] = e.text);
    document.getElementById("gate").style.display = "none";
    start();
  } catch (err) { msg.textContent = "연결하지 못했습니다."; }
}

function start() {
  const t = new Date();
  cy = t.getFullYear(); cm = t.getMonth() + 1;
  sel = `${cy}-${pad(cm)}-${pad(t.getDate())}`;
  initSelects();
  render();
}

const saved = sessionStorage.getItem("pw");
if (saved) { document.getElementById("gpw").value = saved; unlock(); }
</script>
</body>
</html>
