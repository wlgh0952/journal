<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Diary</title>
<style>
  body { margin:0; background:#111; color:#ddd;
         font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:13px; line-height:1.8; }
  #wrap { max-width:720px; margin:0 auto; padding:30px 20px; }
  h1 { font-size:16px; text-align:center; letter-spacing:2px; margin-bottom:20px; }
  a { color:#9ab; text-decoration:none; cursor:pointer; }
  a:hover, a.on { color:#fff; text-decoration:underline; }
  .nav { text-align:center; margin:8px 0; }
  .nav a { margin:0 6px; }
  hr { border:0; border-top:1px dotted #444; margin:20px 0; }
  .entry { margin-bottom:28px; }
  .date { color:#fff; font-weight:bold; border-bottom:1px solid #333; padding-bottom:4px; margin-bottom:8px; }
  .body { white-space:pre-wrap; }
  .empty { text-align:center; color:#666; }
  footer { text-align:center; color:#555; font-size:11px; margin-top:40px; }
  .tabs { text-align:center; margin-bottom:10px; }
  .tabs a { margin:0 10px; font-weight:bold; }
  #gb { display:none; }
  #gb input, #gb textarea { width:100%; box-sizing:border-box; background:#1a1a1a; color:#ddd;
    border:1px solid #444; padding:6px; margin-bottom:6px; font-family:inherit; font-size:13px; }
  #gb button { background:#333; color:#fff; border:1px solid #555; padding:6px 16px; cursor:pointer; }
  #gb button:hover { background:#555; }
  .gb-item { border-bottom:1px dotted #444; padding:10px 0; }
  .gb-meta { color:#888; font-size:11px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>+++ MY DIARY +++</h1>
  <div class="tabs">
    <a onclick="showTab('diary')">DIARY</a>
    <a onclick="showTab('gb')">GUESTBOOK</a>
  </div>

  <div class="nav" id="years"></div>
  <div class="nav" id="months"></div>
  <hr>
  <div id="list"></div>

  <div id="gb">
    <input id="gb-name" placeholder="이름" maxlength="20">
    <textarea id="gb-msg" rows="4" placeholder="메시지를 남겨주세요" maxlength="500"></textarea>
    <button onclick="addGb()">남기기</button>
    <hr>
    <div id="gb-list"></div>
  </div>

  <footer>© My Diary</footer>
</div>

<script>
const GB_URL = "https://script.google.com/macros/s/AKfycbxvhg42m_Etoh92vhrBlIAE-aJNeXFPY3HGmKJ7rJuQbzCGPDvJz_ibPNdWqNddwY8e/exec";

const entries = [
  { date: "2026-10-17", title: "첫 글", text: "여기에 내용을 쓰세요.\n줄바꿈도 그대로 표시됩니다." },
  { date: "2026-09-02", title: "9월의 기록", text: "예시 글입니다." },
  { date: "2025-12-25", title: "작년 크리스마스", text: "예시 글입니다." }
];

const yearsEl = document.getElementById("years");
const monthsEl = document.getElementById("months");
const listEl = document.getElementById("list");
const years = [...new Set(entries.map(e => e.date.slice(0,4)))].sort().reverse();
let curYear = years[0];
let curMonth = "all";

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function render() {
  yearsEl.innerHTML = years.map(y =>
    `<a class="${y===curYear?'on':''}" onclick="setYear('${y}')">${y}년</a>`).join("");
  let months = '<a class="' + (curMonth==="all"?"on":"") + '" onclick="setMonth(\'all\')">전체</a>';
  for (let m = 1; m <= 12; m++) {
    const mm = String(m).padStart(2,"0");
    const has = entries.some(e => e.date.startsWith(curYear+"-"+mm));
    months += has
      ? `<a class="${curMonth===mm?'on':''}" onclick="setMonth('${mm}')">${m}월</a>`
      : `<span style="color:#444;margin:0 6px">${m}월</span>`;
  }
  monthsEl.innerHTML = months;
  const prefix = curMonth === "all" ? curYear : curYear + "-" + curMonth;
  const shown = entries.filter(e => e.date.startsWith(prefix))
                       .sort((a,b) => b.date.localeCompare(a.date));
  listEl.innerHTML = shown.length
    ? shown.map(e => `
        <div class="entry">
          <div class="date">${e.date.replaceAll("-",".")} &nbsp; ${esc(e.title)}</div>
          <div class="body">${esc(e.text)}</div>
        </div>`).join("")
    : '<div class="empty">작성된 글이 없습니다.</div>';
}
function setYear(y){ curYear = y; curMonth = "all"; render(); }
function setMonth(m){ curMonth = m; render(); }
render();

const navs = document.querySelectorAll(".nav");
const hrs = document.querySelectorAll("#wrap > hr");
function showTab(t) {
  const isGb = t === "gb";
  document.getElementById("gb").style.display = isGb ? "block" : "none";
  navs.forEach(n => n.style.display = isGb ? "none" : "block");
  listEl.style.display = isGb ? "none" : "block";
  hrs.forEach(h => h.style.display = isGb ? "none" : "block");
  if (isGb) renderGb();
}

async function renderGb() {
  const box = document.getElementById("gb-list");
  box.innerHTML = '<div class="empty">불러오는 중...</div>';
  try {
    const a = await (await fetch(GB_URL)).json();
    box.innerHTML = a.length
      ? a.map(e => `
          <div class="gb-item">
            <div class="gb-meta"><b style="color:#fff">${esc(String(e.name))}</b> · ${esc(String(e.time))}</div>
            <div class="body">${esc(String(e.msg))}</div>
          </div>`).join("")
      : '<div class="empty">아직 방명록이 비어 있어요.</div>';
  } catch (err) {
    box.innerHTML = '<div class="empty">불러오지 못했습니다.</div>';
  }
}

async function addGb() {
  const name = document.getElementById("gb-name").value.trim() || "익명";
  const msg = document.getElementById("gb-msg").value.trim();
  if (!msg) return alert("메시지를 입력해주세요.");
  const btn = document.querySelector("#gb button");
  btn.disabled = true;
  try {
    await fetch(GB_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ name, msg })
    });
    document.getElementById("gb-msg").value = "";
    await renderGb();
  } catch (err) {
    alert("전송에 실패했습니다.");
  }
  btn.disabled = false;
}
</script>
</body>
</html>
